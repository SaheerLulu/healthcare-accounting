# ============================================================
# Deploy DEV – triggered on push to 'develop' branch
# Deploys to: devaccounting.seefmed.com
# ============================================================
name: Deploy DEV

on:
  push:
    branches:
      - develop

jobs:
  deploy-dev:
    name: Deploy to DEV server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Copy repo to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "backend,frontend,deploy"
          target: "/opt/accounting/repo"
          rm: true
          overwrite: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            REPO_DIR="/opt/accounting/repo"
            ENV_DIR="/opt/accounting/dev"
            COMPOSE_FILE="${REPO_DIR}/deploy/docker-compose.dev.yml"
            ENV_FILE="${ENV_DIR}/.env"

            echo "=== Accounting DEV Deployment started at $(date -u) ==="

            # Verify sudo works
            sudo -n true 2>/dev/null || { echo "ERROR: Deploy user needs passwordless sudo"; exit 1; }

            # Ensure env file exists
            if [ ! -f "$ENV_FILE" ]; then
              echo "Creating default env file..."
              mkdir -p "$ENV_DIR"
              cp "${REPO_DIR}/deploy/envs/.env.dev.example" "$ENV_FILE"
              sed -i "s|DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}|" "$ENV_FILE"
              if [ -n "${{ secrets.POSTGRES_PASSWORD }}" ]; then
                sed -i "s|PASSWORD|${{ secrets.POSTGRES_PASSWORD }}|g" "$ENV_FILE"
              fi
            fi

            # Build and deploy
            echo "Building containers..."
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build

            echo "Starting containers..."
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" down --remove-orphans || true
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d

            # Update Nginx config for accounting
            echo "Updating Nginx..."
            if sudo bash -c '
              if [ -f /etc/letsencrypt/live/devaccounting.seefmed.com/fullchain.pem ]; then
                cp /opt/accounting/repo/deploy/nginx/dev.conf /etc/nginx/sites-available/devaccounting.conf
              else
                cp /opt/accounting/repo/deploy/nginx/dev.bootstrap.conf /etc/nginx/sites-available/devaccounting.conf
              fi
              ln -sf /etc/nginx/sites-available/devaccounting.conf /etc/nginx/sites-enabled/
              nginx -t
              systemctl reload nginx
            ' 2>&1; then
              echo "Nginx reloaded."
            else
              echo "WARNING: Nginx update failed."
            fi

            # Health check
            sleep 15
            echo "Container status:"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" ps || true
            echo "Container logs (last 30 lines):"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" logs --tail=30 || true

            echo "=== Accounting DEV Deployment completed at $(date -u) ==="

      - name: Notify on failure
        if: failure()
        run: echo "::error::Accounting DEV deployment failed! Check the logs above."
