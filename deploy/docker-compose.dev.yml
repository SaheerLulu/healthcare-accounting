# ============================================================
# DEV environment – docker-compose
# Domain: devaccounting.seefmed.com
# Run:  docker compose -f deploy/docker-compose.dev.yml --env-file deploy/envs/.env.dev up -d --build
# ============================================================

name: accounting-dev

services:
  # ---- Django backend (dev) ----
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: accounting-dev-backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn accounting_project.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 900 --reload"
    volumes:
      - dev-static:/app/staticfiles
    expose:
      - "8000"
    environment:
      - DJANGO_ENV=${DJANGO_ENV:-development}
      - DJANGO_SETTINGS_MODULE=accounting_project.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-change-me}
      # Publicly reachable behind TLS (devaccounting.seefmed.com) — run with
      # prod-grade DEBUG/hosts/CORS even though DJANGO_ENV=development.
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-devaccounting.seefmed.com,localhost,127.0.0.1}
      - DJANGO_CORS_ALLOWED_ORIGINS=${DJANGO_CORS_ALLOWED_ORIGINS:-https://devaccounting.seefmed.com}
      - DATABASE_URL=${DATABASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - accounting-dev
    restart: unless-stopped

  # ---- Inventory → journal sync scheduler (dev) ----
  # Posts journal entries for new pharmacy transactions every 5 minutes.
  # Safe alongside ad-hoc syncs: sync_all() holds a Postgres advisory
  # lock, so concurrent runs skip instead of double-posting.
  scheduler-sync:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: accounting-dev-scheduler-sync
    depends_on:
      - backend
    command: >
      sh -c "while true; do
               python manage.py scheduled_sync || echo 'sync failed';
               sleep $${SYNC_INTERVAL:-300};
             done"
    environment:
      - DJANGO_ENV=${DJANGO_ENV:-development}
      - DJANGO_SETTINGS_MODULE=accounting_project.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-change-me}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-devaccounting.seefmed.com,localhost,127.0.0.1}
      - DJANGO_CORS_ALLOWED_ORIGINS=${DJANGO_CORS_ALLOWED_ORIGINS:-https://devaccounting.seefmed.com}
      - DATABASE_URL=${DATABASE_URL:-}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - accounting-dev
    restart: unless-stopped

  # ---- React frontend (dev) ----
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: accounting-dev-frontend
    ports:
      - "${DEV_FRONTEND_PORT:-3003}:3000"
    depends_on:
      - backend
    networks:
      - accounting-dev
    restart: unless-stopped

volumes:
  dev-static:

networks:
  accounting-dev:
    driver: bridge
