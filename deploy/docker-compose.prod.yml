# ============================================================
# PROD environment – docker-compose
# Domain: accounting.biloop.ai
# Run:  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/envs/.env.prod up -d --build
# ============================================================

services:
  # ---- Django backend (prod) ----
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: accounting-prod-backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn accounting_project.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 1800"
    volumes:
      - prod-static:/app/staticfiles
    expose:
      - "8000"
    environment:
      - DJANGO_ENV=production
      - DJANGO_SETTINGS_MODULE=accounting_project.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-accounting.biloop.ai,localhost}
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://accounting.biloop.ai}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://accounting.biloop.ai}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - accounting-prod
    restart: unless-stopped

  # ---- React frontend (prod) ----
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: accounting-prod-frontend
    ports:
      - "${PROD_FRONTEND_PORT:-3004}:3000"
    depends_on:
      - backend
    networks:
      - accounting-prod
    restart: unless-stopped

volumes:
  prod-static:

networks:
  accounting-prod:
    driver: bridge
