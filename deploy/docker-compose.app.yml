# ============================================================
# Parameterized stack — one compose file for every environment.
#
# Images are built by GitHub Actions and pulled from GHCR;
# BACKEND_IMAGE / FRONTEND_IMAGE are exported by
# deploy/scripts/remote-deploy.sh. Everything else comes from
# the environment's .env file (see deploy/envs/*.example):
#
#   docker compose -p accounting-<env> -f deploy/docker-compose.app.yml \
#     --env-file /opt/accounting/<env>/.env up -d
#
# The accounting app has no database of its own — it uses the
# pharmacy app's PostgreSQL database (host install) for the
# corresponding environment, reached via host.docker.internal.
# ============================================================

x-django-base: &django-base
  image: ${BACKEND_IMAGE:?exported by remote-deploy.sh}
  environment: &django-env
    DJANGO_ENV: ${DJANGO_ENV:-production}
    DJANGO_SETTINGS_MODULE: accounting_project.settings
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
    DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
    DATABASE_URL: ${DATABASE_URL:-}
    PARTY_LEDGERS_ENABLED: ${PARTY_LEDGERS_ENABLED:-}
    SYNC_INTERVAL: ${SYNC_INTERVAL:-300}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  # ---- Django backend ----
  backend:
    <<: *django-base
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn accounting_project.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout 1800"
    volumes:
      - static:/app/staticfiles
    expose:
      - "8000"

  # ---- Inventory → journal sync scheduler ----
  # Posts journal entries for new pharmacy transactions. Safe alongside
  # ad-hoc syncs: sync_all() holds a Postgres advisory lock, so
  # concurrent runs skip instead of double-posting.
  scheduler-sync:
    <<: *django-base
    depends_on:
      - backend
    command: >
      sh -c "while true; do
               python manage.py scheduled_sync || echo 'sync failed';
               sleep $${SYNC_INTERVAL:-300};
             done"

  # ---- React frontend (nginx serving the build, proxies /api to backend) ----
  frontend:
    image: ${FRONTEND_IMAGE:?exported by remote-deploy.sh}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:?set in the environment .env file}:3000"
    restart: unless-stopped

volumes:
  static:
